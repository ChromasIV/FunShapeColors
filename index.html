<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fun Shape Colors</title>
<style>
  :root {
    --bg1: #fff7d6; --bg2: #d9f0ff;
    --ink: #3b3355;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif; color: var(--ink); }
  body { background: linear-gradient(160deg, var(--bg1), var(--bg2)); display: flex; flex-direction: column; }
  header { display: flex; gap: 10px; justify-content: center; align-items: center; padding: 12px 12px 4px; flex-wrap: wrap; }
  .mode { font: inherit; font-size: clamp(16px, 3.2vw, 24px); font-weight: bold; padding: 10px 20px; border-radius: 999px; border: 4px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
  .mode.on { background: #ffd23f; box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px); }
  #bar { display: flex; gap: 12px; justify-content: center; align-items: center; padding: 4px 12px; }
  .tool { font: inherit; font-size: clamp(14px, 2.6vw, 20px); font-weight: bold; padding: 8px 16px; border-radius: 999px; border: 3px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
  #stars { font-size: clamp(20px, 4vw, 30px); font-weight: bold; min-width: 3.2em; text-align: center; }
  .swatch { display: inline-block; width: .9em; height: .9em; border-radius: 50%; border: 3px solid var(--ink); vertical-align: -.05em; margin-right: .25em; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1) } 97% { transform: scaleY(.1) } }
  .block:not(.drag):not(.placed) { animation: bob 3s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes bob { 50% { translate: 0 -6px } }
  .block.hint { animation: jig .8s ease-in-out infinite !important; }
  @keyframes jig { 0%, 100% { rotate: 0deg; scale: 1 } 25% { rotate: -8deg; scale: 1.12 } 75% { rotate: 8deg; scale: 1.12 } }
  .slot.hintslot { animation: glow .8s ease-in-out infinite; }
  @keyframes glow { 50% { transform: scale(1.1); border-color: #ffb703; background: #fff3c4 } }
  #prompt { text-align: center; font-size: clamp(22px, 5vw, 40px); font-weight: bold; padding: 6px 12px; min-height: 1.4em; }
  #board { flex: 1; display: flex; flex-direction: column; justify-content: space-around; padding: 0 12px 12px; position: relative; min-height: 0; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 3vw, 28px); }
  .slot, .block { width: var(--size); height: var(--size); flex: none; }
  #board { --size: min(14.5vw, 17vh, 140px); }
  .slot { border-radius: 24px; background: rgba(255,255,255,.65); border: 4px dashed #b9b3d0; display: grid; place-items: center; transition: transform .2s; }
  .slot.hover { transform: scale(1.08); border-color: var(--ink); }
  .slot.done { border-style: solid; border-color: transparent; background: rgba(255,255,255,.9); }
  .slot svg, .block svg { width: 86%; height: 86%; overflow: visible; }
  .block { touch-action: none; cursor: grab; position: relative; filter: drop-shadow(0 6px 0 rgba(0,0,0,.18)); transition: transform .15s; }
  .block.drag { animation: none; cursor: grabbing; z-index: 50; transform: scale(1.12) rotate(-4deg); transition: none; filter: drop-shadow(0 14px 8px rgba(0,0,0,.25)); }
  .block.back { transition: left .3s, top .3s, transform .3s; }
  .block.wobble { animation: wobble .5s; }
  .block.placed { pointer-events: none; filter: none; }
  .tray { background: rgba(255,255,255,.5); border-radius: 30px; padding: 14px; }
  @keyframes wobble { 0%,100% { rotate: 0deg } 20% { rotate: -14deg } 40% { rotate: 12deg } 60% { rotate: -8deg } 80% { rotate: 6deg } }
  @keyframes pop { 0% { transform: scale(1) } 50% { transform: scale(1.3) } 100% { transform: scale(1) } }
  .pop { animation: pop .4s; }
  #win { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(255,255,255,.75); z-index: 100; font-size: clamp(36px, 9vw, 80px); font-weight: bold; text-align: center; }
  #win.show { display: flex; }
  #next { font: inherit; font-size: clamp(24px, 6vw, 44px); font-weight: bold; padding: 14px 40px; border-radius: 999px; border: 5px solid var(--ink); background: #5ad66f; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); cursor: pointer; box-shadow: 0 6px 0 var(--ink); }
  .confetti { position: fixed; top: -20px; width: 14px; height: 14px; z-index: 120; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .spark { position: fixed; width: 12px; height: 12px; border-radius: 50%; z-index: 120; pointer-events: none; animation: burst .6s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
</style>
</head>
<body>
<header>
  <button class="mode on" data-mode="shapes">🔷 Shapes</button>
  <button class="mode" data-mode="colors">🎨 Colors</button>
  <button class="mode" data-mode="both">⭐ Both</button>
  <button class="mode" data-mode="find">🎯 Find it</button>
</header>
<div id="bar">
  <button class="tool" id="say">🔁 Say it again</button>
  <span id="stars" title="Stars earned">⭐ 0</span>
  <button class="tool" id="mute">🔊 Sound on</button>
</div>
<div id="prompt"></div>
<div id="board">
  <div class="row" id="slots"></div>
  <div class="row tray" id="tray"></div>
</div>
<div id="win"><div>🎉 Great job! 🎉</div><button id="next">Play again ▶</button></div>

<script>
const SHAPES = {
  circle:   '<circle cx="50" cy="50" r="44"/>',
  square:   '<rect x="8" y="8" width="84" height="84" rx="6"/>',
  triangle: '<polygon points="50,6 96,90 4,90" stroke-linejoin="round"/>',
  star:     '<polygon points="50,4 62,36 96,38 69,59 79,93 50,73 21,93 31,59 4,38 38,36" stroke-linejoin="round"/>',
  heart:    '<path d="M50 90 C10 58 4 34 20 18 C34 6 46 14 50 26 C54 14 66 6 80 18 C96 34 90 58 50 90Z"/>',
  diamond:  '<polygon points="50,4 96,50 50,96 4,50" stroke-linejoin="round"/>',
  rectangle:'<rect x="4" y="22" width="92" height="56" rx="6"/>',
  oval:     '<ellipse cx="50" cy="50" rx="46" ry="30"/>',
  hexagon:  '<polygon points="50,5 91,27.5 91,72.5 50,95 9,72.5 9,27.5" stroke-linejoin="round"/>',
  pentagon: '<polygon points="50,5 96,38 78,92 22,92 4,38" stroke-linejoin="round"/>',
};
const COLORS = {
  red: '#ef4444', blue: '#3b82f6', yellow: '#facc15',
  green: '#22c55e', orange: '#fb923c', purple: '#a855f7',
};
const GRAY = '#cfcadf';
let mode = 'shapes', placedCount = 0, items = [], muted = false, target = null, hintT;
const kind = () => mode === 'find' ? 'both' : mode;

const $ = s => document.querySelector(s);
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const FACE_Y = { triangle: 12, star: 3, heart: -2, oval: 0 };
const face = (shape, happy) => {
  const y = FACE_Y[shape] || 0;
  return `<g transform="translate(0 ${y})" stroke="none">
    <ellipse class="eye" cx="38" cy="45" rx="7" ry="8" fill="#fff"/><ellipse class="eye" cx="62" cy="45" rx="7" ry="8" fill="#fff"/>
    <circle cx="39" cy="46" r="3.6" fill="#2b2540"/><circle cx="61" cy="46" r="3.6" fill="#2b2540"/>
    <path d="${happy ? 'M36 60 Q50 78 64 60 Z' : 'M41 62 Q50 69 59 62'}" fill="${happy ? '#7a2b3f' : 'none'}" stroke="#2b2540" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`;
};
const svg = (shape, fill, opacity = 1, stroke = 'rgba(0,0,0,.25)', mood = null) =>
  `<svg viewBox="0 0 100 100" fill="${fill}" fill-opacity="${opacity}" stroke="${stroke}" stroke-width="3">${SHAPES[shape]}${mood ? face(shape, mood === 'happy') : ''}</svg>`;

/* ---------- sound ---------- */
let ac;
function setPrompt(text, html) { $('#prompt').innerHTML = html || text; window._promptText = text; say(text); }
function nextTarget() {
  const left = items.filter(it => !document.querySelector(`.slot.done[data-key="${it.key}"]`));
  target = left[Math.floor(Math.random() * left.length)];
  const text = `Find the ${nameOf(target)}!`;
  setPrompt(text, `Find the <span class="swatch" style="background:${COLORS[target.color]}"></span>${target.color} ${target.shape}!`);
  armHint();
}
function armHint() {
  clearTimeout(hintT);
  document.querySelectorAll('.hint,.hintslot').forEach(e => e.classList.remove('hint', 'hintslot'));
  hintT = setTimeout(() => {
    const left = items.filter(it => !document.querySelector(`.slot.done[data-key="${it.key}"]`) && document.querySelector(`.block[data-id="${it.id}"]:not(.placed)`));
    const it = mode === 'find' && target ? target : left[0];
    if (!it) return;
    document.querySelector(`.block[data-id="${it.id}"]`)?.classList.add('hint');
    if (mode !== 'find') document.querySelector(`.slot:not(.done)[data-key="${it.key}"]`)?.classList.add('hintslot');
    else say('Hmm, ' + nameOf(it) + '. Can you find it?');
  }, 8000);
}
function tone(freqs, dur = .15, type = 'sine') {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
    });
  } catch (e) {}
}
function say(text) {
  if (muted) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = .85; u.pitch = 1.3;
    speechSynthesis.speak(u);
  } catch (e) {}
}
const nameOf = it => kind() === 'shapes' ? it.shape : kind() === 'colors' ? it.color : `${it.color} ${it.shape}`;

/* ---------- round setup ---------- */
function newRound() {
  $('#win').classList.remove('show');
  placedCount = 0;
  const allShapes = Object.keys(SHAPES);
  const colors = shuffle(Object.keys(COLORS));            // 6 different colors
  let shapes;
  if (kind() === 'colors') {
    shapes = Array.from({length: 6}, () => allShapes[Math.floor(Math.random() * allShapes.length)]);
  } else {
    const three = shuffle(allShapes).slice(0, 3);          // each shape appears twice, in different colors
    shapes = shuffle([...three, ...three]);
  }
  items = shapes.map((shape, i) => ({
    id: i, shape, color: colors[i],
    key: kind() === 'shapes' ? shape : kind() === 'colors' ? colors[i] : shape + '-' + colors[i],
  }));
  const slots = $('#slots'), tray = $('#tray');
  slots.innerHTML = tray.innerHTML = '';
  shuffle(items).forEach(it => {
    const s = document.createElement('div');
    s.className = 'slot'; s.dataset.key = it.key;
    s.innerHTML = kind() === 'shapes' ? svg(it.shape, GRAY, 1, '#aaa3c4')
                : kind() === 'colors' ? svg('circle', COLORS[it.color], .35, COLORS[it.color])
                : svg(it.shape, COLORS[it.color], .3, COLORS[it.color]);
    slots.appendChild(s);
  });
  shuffle(items).forEach(it => {
    const b = document.createElement('div');
    b.className = 'block'; b.dataset.id = it.id;
    b.innerHTML = svg(it.shape, COLORS[it.color], 1, 'rgba(0,0,0,.25)', 'calm');
    b.style.setProperty('--d', (Math.random() * -3) + 's');
    tray.appendChild(b);
    enableDrag(b, it);
  });
  if (mode === 'find') { nextTarget(); return; }
  const hint = kind() === 'shapes' ? 'Match the shapes!' : kind() === 'colors' ? 'Match the colors!' : 'Match the colors and shapes!';
  setPrompt(hint);
  armHint();
}

/* ---------- drag & drop ---------- */
function enableDrag(el, it) {
  let sx, sy, ox, oy, dragging = false, moved = false;
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('placed')) return;
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; moved = false;
    ox = el.offsetLeft; oy = el.offsetTop; dragging = true;
    el._home = { w: r.width };
    el.classList.remove('back', 'wobble');
    el.classList.add('drag');
    ac && ac.state === 'suspended' && ac.resume();
    armHint();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    el.style.transform = `translate(${dx}px, ${dy}px) scale(1.12) rotate(-4deg)`;
    const hit = slotAt(el);
    document.querySelectorAll('.slot').forEach(s => s.classList.toggle('hover', s === hit));
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('drag');
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('hover'));
    if (!moved) { el.style.transform = ''; say(nameOf(it)); el.classList.add('wobble'); setTimeout(() => el.classList.remove('wobble'), 500); return; }  // tap = hear its name
    const hit = slotAt(el);
    if (mode === 'find' && target && it.id !== target.id && hit) {
      el.classList.add('back', 'wobble'); el.style.transform = '';
      setTimeout(() => el.classList.remove('wobble'), 500);
      tone([300, 240], .18, 'triangle');
      say(`That is the ${nameOf(it)}. Find the ${nameOf(target)}!`);
      return;
    }
    if (hit && hit.dataset.key === it.key) {
      place(el, hit, it);
    } else {
      el.classList.add('back');
      el.style.transform = '';
      if (hit) { tone([300, 240], .18, 'triangle'); say('Try again!'); el.classList.add('wobble'); setTimeout(() => el.classList.remove('wobble'), 500); }
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function slotAt(el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (const s of document.querySelectorAll('.slot:not(.done)')) {
    const b = s.getBoundingClientRect();
    if (cx > b.left && cx < b.right && cy > b.top && cy < b.bottom) return s;
  }
  return null;
}

function place(el, slot, it) {
  el.classList.add('placed');
  slot.classList.add('done', 'pop');
  slot.innerHTML = svg(it.shape, COLORS[it.color], 1, 'rgba(0,0,0,.25)', 'happy');
  el.style.visibility = 'hidden';
  const r = slot.getBoundingClientRect();
  sparkle(r.left + r.width / 2, r.top + r.height / 2);
  tone([523, 659, 784]);
  const label = nameOf(it);
  say(label.charAt(0).toUpperCase() + label.slice(1) + '!');
  armHint();
  if (++placedCount === items.length) { clearTimeout(hintT); setTimeout(win, 1100); }
  else if (mode === 'find') setTimeout(nextTarget, 1400);
}

/* ---------- celebration ---------- */
function sparkle(x, y) {
  const cols = Object.values(COLORS);
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'spark';
    p.style.left = x + 'px'; p.style.top = y + 'px';
    p.style.background = cols[i % cols.length];
    const a = Math.random() * 6.28, d = 50 + Math.random() * 60;
    p.style.setProperty('--dx', Math.cos(a) * d + 'px');
    p.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}
let stars = 0;
try { stars = +localStorage.getItem('fsc_stars') || 0; } catch (e) {}
const showStars = () => { $('#stars').textContent = '⭐ ' + stars; };
function win() {
  stars++; showStars(); $('#stars').classList.add('pop');
  try { localStorage.setItem('fsc_stars', stars); } catch (e) {}
  $('#win').classList.add('show');
  tone([523, 659, 784, 1047], .18);
  say('Great job!');
  const cols = Object.values(COLORS);
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = 2 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * .8 + 's';
    c.style.borderRadius = i % 2 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

/* ---------- wiring ---------- */
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('on', x === b));
  mode = b.dataset.mode;
  newRound();
}));
$('#next').addEventListener('click', newRound);
$('#say').addEventListener('click', () => say(window._promptText || ''));
$('#mute').addEventListener('click', () => {
  muted = !muted;
  $('#mute').textContent = muted ? '🔇 Sound off' : '🔊 Sound on';
  try { speechSynthesis.cancel(); } catch (e) {}
});
showStars();
newRound();
</script>
</body>
</html>
